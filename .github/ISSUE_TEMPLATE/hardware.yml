name: Hardware / wiring
description: Reference PCB, GPIO, power, pass-through, OLED, or DIY wiring
title: "[hardware] "
labels: ["hardware"]
body:
  - type: markdown
    attributes:
      value: |
        For GPIO maps see `docs/hardware.md`. KiCad lives under `kicad/` when published.
  - type: dropdown
    id: hw-kind
    attributes:
      label: Topic
      options:
        - Reference PCB / KiCad
        - DIY Pico wiring
        - ADB pass-through / hub
        - Power / level shifting
        - OLED / buttons
        - Other
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Board revision or wiring notes
      description: PCB rev, or “bare Pico on breadboard”
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Symptoms, measurements, photos description, expected vs actual.
    validations:
      required: true
